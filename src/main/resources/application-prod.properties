# Perfil de producción (lo activa la imagen Docker con SPRING_PROFILES_ACTIVE=prod).

# La consola de H2 da acceso completo a la base de datos: nunca en producción.
spring.h2.console.enabled=false
# Sin servidor TCP automático de H2: solo este proceso usa el fichero.
spring.datasource.url=jdbc:h2:file:./data/tareas
# Sin datos inventados en una instalación real.
app.datos-ejemplo=false
# No mostrar detalles internos en los errores.
server.error.include-stacktrace=never
server.error.include-message=never
