spring.application.name=gestor-tareas

# Base de datos H2 en un fichero local (carpeta data/, ignorada por git).
# Los datos se conservan entre reinicios.
spring.datasource.url=jdbc:h2:file:./data/tareas;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2 en /h2-console (solo para desarrollo).
spring.h2.console.enabled=true

# Documentación de la API.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Solo se exponen los endpoints de salud e información.
management.endpoints.web.exposure.include=health,info

# Crea tareas de ejemplo si la base de datos está vacía.
app.datos-ejemplo=true
