name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests y cobertura
        run: ./mvnw -B verify
      - name: Guardar informe de cobertura
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Construir la imagen
        run: docker build -t gestor-tareas .
      - name: Arrancar el contenedor y comprobar que responde
        run: |
          docker run -d --name app -p 8080:8080 gestor-tareas
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health | grep -q UP; then break; fi
            sleep 2
          done
          curl -fs http://localhost:8080/actuator/health
          curl -fs http://localhost:8080/api/tareas/resumen
          curl -fs -o /dev/null http://localhost:8080/
      - name: Registros del contenedor
        if: failure()
        run: docker logs app
